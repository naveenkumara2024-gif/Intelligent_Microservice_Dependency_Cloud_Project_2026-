services:
  neo4j:
    image: neo4j:5-community
    container_name: rca-neo4j
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    environment:
      # CHANGE ME before using this anywhere beyond local prototyping.
      NEO4J_AUTH: neo4j/changeme123
    volumes:
      - neo4j_data:/data

  # Stage 8: local TinkerPop Gremlin Server (in-memory TinkerGraph, no auth) to exercise the
  # Lambda transformer's Gremlin writer. 3.7.x matches the series Neptune supports (3.7.1-3.7.3).
  # Start with:  docker compose --profile gremlin up -d gremlin-server
  gremlin-server:
    image: tinkerpop/gremlin-server:3.7.3
    container_name: rca-gremlin
    profiles: ["gremlin"]
    ports:
      - "8182:8182"

  # Stage 11: local DynamoDB (in-memory) to exercise the scorer's state/incident persistence,
  # including the transactional version check. Start with:
  #   docker compose --profile dynamodb up -d dynamodb-local
  dynamodb-local:
    image: amazon/dynamodb-local:3.1.0
    container_name: rca-dynamodb
    profiles: ["dynamodb"]
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

volumes:
  neo4j_data:
