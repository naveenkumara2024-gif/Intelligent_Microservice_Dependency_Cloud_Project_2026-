# Overlay on k8s/online-boutique that makes the storefront reachable from the internet.
# The base keeps it private (ClusterIP); this is the explicit opt-in:
#   npm run expose:storefront            (apply)   npm run expose:storefront -- --off   (undo)
#
# An internet-facing Classic ELB, plain HTTP on port 80, open to everyone unless
# `--allow=<cidr>` is given. This AWS account refuses Network Load Balancers (NLBs)
# with OperationNotPermitted, but Classic ELBs are supported and provisioned by the
# in-tree AWS cloud provider when a Service is type: LoadBalancer without the NLB annotation.
# Online Boutique has no authentication and is a demo app: it accepts fake card numbers
# at checkout and stores nothing sensitive, but treat it as public.
#
# `npm run destroy:eks` (scripts/pre-destroy.ts) deletes any LoadBalancer Service first, so this
# load balancer cannot be orphaned and block VPC deletion. If you destroy with `cdk destroy`
# directly, run `npx tsx scripts/pre-destroy.ts` (or `npm run expose:storefront -- --off`) first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../online-boutique
patches:
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
      spec:
        type: LoadBalancer
