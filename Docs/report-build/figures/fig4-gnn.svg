<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker></defs><rect x="20" y="20" width="1560" height="150" rx="10" fill="#ffffff" stroke="#3B48CC" stroke-width="2.5"/><rect x="20" y="20" width="9" height="150" rx="3" fill="#3B48CC"/><text x="42" y="55" font-size="25" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Inputs per scoring window</text><text x="42" y="88" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Node (7 features): call volume as caller and as callee, in-degree, out-degree; own latency deviation;</text><text x="42" y="115" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">maximum and mean deviation of the services it calls.   Edge (9): average and p95 latency, log volume, RPC type.</text><rect x="20" y="230" width="360" height="180" rx="10" fill="#ffffff" stroke="#01A88D" stroke-width="2.5"/><rect x="20" y="230" width="9" height="180" rx="3" fill="#01A88D"/><text x="42" y="265" font-size="25" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">GATv2Conv</text><text x="42" y="298" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">attention over</text><text x="42" y="325" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">neighbours,</text><text x="42" y="352" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">uses edge features</text><rect x="413" y="230" width="360" height="180" rx="10" fill="#ffffff" stroke="#01A88D" stroke-width="2.5"/><rect x="413" y="230" width="9" height="180" rx="3" fill="#01A88D"/><text x="435" y="265" font-size="25" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">3 x SAGEConv</text><text x="435" y="298" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">neighbourhood</text><text x="435" y="325" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">aggregation;</text><text x="435" y="352" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">reach: 4 hops</text><path d="M380,320 L413,320" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><rect x="806" y="230" width="300" height="180" rx="10" fill="#ffffff" stroke="#01A88D" stroke-width="2.5"/><rect x="806" y="230" width="9" height="180" rx="3" fill="#01A88D"/><text x="828" y="265" font-size="25" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Linear</text><text x="828" y="298" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">one score</text><text x="828" y="325" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">per service</text><path d="M773,320 L806,320" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><rect x="1139" y="230" width="440" height="180" rx="10" fill="#ffffff" stroke="#01A88D" stroke-width="2.5"/><rect x="1139" y="230" width="9" height="180" rx="3" fill="#01A88D"/><text x="1161" y="265" font-size="25" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Softmax</text><text x="1161" y="298" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">ranking over services;</text><text x="1161" y="325" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">cross-entropy on the</text><text x="1161" y="352" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">injected root cause</text><path d="M1106,320 L1139,320" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><path d="M200,170 L200,228" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><text x="20" y="488" font-size="25" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Why it separates cause from symptom (calls A -&gt; B -&gt; C, fault at C)</text><rect x="20" y="515" width="180" height="58" rx="0" fill="#e9ecef" stroke="#879196" stroke-width="1.5"/><text x="34" y="553" font-size="22" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Service</text><rect x="200" y="515" width="260" height="58" rx="0" fill="#e9ecef" stroke="#879196" stroke-width="1.5"/><text x="214" y="553" font-size="22" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Own deviation</text><rect x="460" y="515" width="370" height="58" rx="0" fill="#e9ecef" stroke="#879196" stroke-width="1.5"/><text x="474" y="553" font-size="22" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Deviation of what it calls</text><rect x="830" y="515" width="750" height="58" rx="0" fill="#e9ecef" stroke="#879196" stroke-width="1.5"/><text x="844" y="553" font-size="22" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Interpretation</text><rect x="20" y="573" width="180" height="58" rx="0" fill="#ffffff" stroke="#879196" stroke-width="1.5"/><text x="34" y="611" font-size="22" font-weight="normal" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">A</text><rect x="200" y="573" width="260" height="58" rx="0" fill="#ffffff" stroke="#879196" stroke-width="1.5"/><text x="214" y="611" font-size="22" font-weight="normal" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">medium</text><rect x="460" y="573" width="370" height="58" rx="0" fill="#ffffff" stroke="#879196" stroke-width="1.5"/><text x="474" y="611" font-size="22" font-weight="normal" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">high</text><rect x="830" y="573" width="750" height="58" rx="0" fill="#ffffff" stroke="#879196" stroke-width="1.5"/><text x="844" y="611" font-size="22" font-weight="normal" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">slow because something it calls is slow</text><rect x="20" y="631" width="180" height="58" rx="0" fill="#ffffff" stroke="#879196" stroke-width="1.5"/><text x="34" y="669" font-size="22" font-weight="normal" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">B</text><rect x="200" y="631" width="260" height="58" rx="0" fill="#ffffff" stroke="#879196" stroke-width="1.5"/><text x="214" y="669" font-size="22" font-weight="normal" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">high</text><rect x="460" y="631" width="370" height="58" rx="0" fill="#ffffff" stroke="#879196" stroke-width="1.5"/><text x="474" y="669" font-size="22" font-weight="normal" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">very high</text><rect x="830" y="631" width="750" height="58" rx="0" fill="#ffffff" stroke="#879196" stroke-width="1.5"/><text x="844" y="669" font-size="22" font-weight="normal" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">relays the fault upstream</text><rect x="20" y="689" width="180" height="58" rx="0" fill="#ffffff" stroke="#879196" stroke-width="1.5"/><text x="34" y="727" font-size="22" font-weight="normal" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">C</text><rect x="200" y="689" width="260" height="58" rx="0" fill="#ffffff" stroke="#879196" stroke-width="1.5"/><text x="214" y="727" font-size="22" font-weight="normal" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">very high</text><rect x="460" y="689" width="370" height="58" rx="0" fill="#e6f6f3" stroke="#879196" stroke-width="1.5"/><text x="474" y="727" font-size="22" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">normal</text><rect x="830" y="689" width="750" height="58" rx="0" fill="#e6f6f3" stroke="#879196" stroke-width="1.5"/><text x="844" y="727" font-size="22" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">slow while what it calls is fine: root cause</text><text x="20" y="810" font-size="21" font-weight="normal" fill="#414750" text-anchor="start" font-style="italic" style="font-family:'Segoe UI',Arial,sans-serif">Labels come from synthetic fault injection on the real Alibaba call graph;</text><text x="20" y="842" font-size="21" font-weight="normal" fill="#414750" text-anchor="start" font-style="italic" style="font-family:'Segoe UI',Arial,sans-serif">the trace data has no failure column.</text></svg>