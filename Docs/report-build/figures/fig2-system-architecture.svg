x="842" y="621" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">latency sum, recent average, latency histogram</text><path d="M332,452 L332,524" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><path d="M632,604 L820,604" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><rect x="32" y="756" width="520" height="160" rx="10" fill="#ffffff" stroke="#ED7100" stroke-width="2.5"/><rect x="32" y="756" width="9" height="160" rx="3" fill="#ED7100"/><text x="54" y="792" font-size="26" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Scorer (Lambda)</text><text x="54" y="826" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">window = counters now minus</text><text x="54" y="853" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">counters at the previous run</text><rect x="610" y="756" width="450" height="160" rx="10" fill="#ffffff" stroke="#ED7100" stroke-width="2.5"/><rect x="610" y="756" width="9" height="160" rx="3" fill="#ED7100"/><text x="632" y="792" font-size="26" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Gate</text><text x="632" y="826" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">any service &gt;= 2x its</text><text x="632" y="853" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">learned baseline?</text><rect x="1115" y="756" width="500" height="160" rx="10" fill="#ffffff" stroke="#01A88D" stroke-width="2.5"/><rect x="1115" y="756" width="9" height="160" rx="3" fill="#01A88D"/><text x="1137" y="792" font-size="26" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">GNN ranking (SageMaker)</text><text x="1137" y="826" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">root cause, blast radius,</text><text x="1137" y="853" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">services at risk</text><path d="M1217,684 L1217,715 L470,715 L470,756" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><path d="M552,836 L610,836" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><path d="M1060,836 L1115,836" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><text x="1087" y="822" font-size="20" font-weight="bold" fill="#01A88D" text-anchor="middle" style="font-family:'Segoe UI',Arial,sans-serif">yes</text><rect x="32" y="988" width="600" height="160" rx="10" fill="#ffffff" stroke="#ED7100" stroke-width="2.5"/><rect x="32" y="988" width="9" height="160" rx="3" fill="#ED7100"/><text x="54" y="1024" font-size="26" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Incident lifecycle</text><text x="54" y="1058" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">open after 2 implicated windows,</text><text x="54" y="1085" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">resolve after 3 clean windows</text><rect x="820" y="988" width="795" height="160" rx="10" fill="#ffffff" stroke="#3B48CC" stroke-width="2.5"/><rect x="820" y="988" width="9" height="160" rx="3" fill="#3B48CC"/><text x="842" y="1024" font-size="26" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">DynamoDB rca-incidents</text><text x="842" y="1058" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">state + incident in one transaction</text><text x="842" y="1085" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">(no duplicates); 30-day TTL; stream</text><path d="M1365,916 L1365,947 L332,947 L332,988" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><path d="M632,1068 L820,1068" fill="none" stroke="#232f3e" stroke-width="3.5" marker-end="url(#ah)"/><rect x="32" y="1220" width="600" height="160" rx="10" fill="#ffffff" stroke="#E7157B" stroke-width="2.5"/><rect x="32" y="1220" width="9" height="160" rx="3" fill="#E7157B"/><text x="54" y="1256" font-size="26" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Dashboard (CloudFront + API)</text><text x="54" y="1290" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">live topology, recent latency,</text><text x="54" y="1317" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">"Slow now" marker, incidents</text><rect x="820" y="1220" width="795" height="160" rx="10" fill="#ffffff" stroke="#E7157B" stroke-width="2.5"/><rect x="820" y="1220" width="9" height="160" rx="3" fill="#E7157B"/><text x="842" y="1256" font-size="26" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Alerts (SNS)</text><text x="842" y="1290" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">one alert when an incident opens, one when it</text><text x="842" y="1317" font-size="21" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">resolves: Slack, PagerDuty, e-mail; DLQ</text><path d="M1217,1148 L1217,1220" fill="none" stroke="#232f3e" stroke