<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1620" viewBox="0 0 2500 1620"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker></defs><rect x="15" y="15" width="1620" height="220" rx="12" fill="#fafbfb" stroke="#d5dbdb" stroke-width="1.5"/><text x="32" y="45" font-size="22" font-weight="bold" fill="#545b64" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Application layer</text><rect x="15" y="247" width="1620" height="220" rx="12" fill="#fafbfb" stroke="#d5dbdb" stroke-width="1.5"/><text x="32" y="277" font-size="22" font-weight="bold" fill="#545b64" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Telemetry and streaming</text><rect x="15" y="479" width="1620" height="220" rx="12" fill="#fafbfb" stroke="#d5dbdb" stroke-width="1.5"/><text x="32" y="509" font-size="22" font-weight="bold" fill="#545b64" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Graph construction</text><rect x="15" y="711" width="1620" height="220" rx="12" fill="#fafbfb" stroke="#d5dbdb" stroke-width="1.5"/><text x="32" y="741" font-size="22" font-weight="bold" fill="#545b64" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Intelligence (every minute)</text><rect x="15" y="943" width="1620" height="220" rx="12" fill="#fafbfb" stroke="#d5dbdb" stroke-width="1.5"/><text x="32" y="973" font-size="22" font-weight="bold" fill="#545b64" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Incident state</text><rect x="15" y="1175" width="1620" height="220" rx="12" fill="#fafbfb" stroke="#d5dbdb" stroke-width="1.5"/><text x="32" y="1205" font-size="22" font-weight="bold" fill="#545b64" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Delivery and visualisation</text><rect x="32" y="60" width="600" height="1