roke-width="2.5"/><rect x="1695" y="1220" width="9" height="108" rx="3" fill="#E7157B"/><text x="1717" y="1253" font-size="23" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Verification scripts</text><text x="1717" y="1284" font-size="20" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">npm run verify:* per stage</text><rect x="1695" y="1345" width="765" height="108" rx="10" fill="#ffffff" stroke="#ED7100" stroke-width="2.5"/><rect x="1695" y="1345" width="9" height="108" rx="3" fill="#ED7100"/><text x="1717" y="1378" font-size="23" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Fault injection (kubectl)</text><text x="1717" y="1409" font-size="20" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">real latency or CPU faults, recorded undo</text><rect x="1695" y="1470" width="765" height="108" rx="10" fill="#ffffff" stroke="#E7157B" stroke-width="2.5"/><rect x="1695" y="1470" width="9" height="108" rx="3" fill="#E7157B"/><text x="1717" y="1503" font-size="23" font-weight="bold" fill="#16191f" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">Infrastructure as code (CDK)</text><text x="1717" y="1534" font-size="20" font-weight="normal" fill="#3b4047" text-anchor="start" style="font-family:'Segoe UI',Arial,sans-serif">npm run up / npm run down</text><path d="M2460,1399 L2488,1399 L2488,6 L1650,6 L1650,100 L1615,100" fill="none" stroke="#232f3e" stroke-width="3.5" stroke-dasharray="10,7" marker-end="url(#ah)"/></svg>